name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  build-and-test:
    name: Build y Test (.NET 10)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restaurar paquetes NuGet
        run: dotnet restore StockFlow.slnx

      - name: Compilar
        run: dotnet build StockFlow.slnx --no-restore -c Release

      - name: Ejecutar pruebas
        run: dotnet test StockFlow.slnx --no-build -c Release